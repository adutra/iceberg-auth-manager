<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authentication Successful</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: sans-serif;
      background: linear-gradient(135deg, #9dddac 0%, #16814a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #333;
    }
    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      padding: 3rem 2rem;
      text-align: center;
      max-width: 500px;
      width: 90%;
      animation: slideUp 0.5s ease-out;
    }
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    h1 {
      color: #1f2937;
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    p {
      color: #6b7280;
      font-size: 1.1rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .success-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      background: #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.5);
      }
      75% {
        box-shadow: 0 0 0 20px rgba(16, 185, 129, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }
    .checkmark {
      width: 40px;
      height: 20px;
      border: 3px solid white;
      border-top: none;
      border-right: none;
      transform: rotate(-45deg);
      margin-top: -10px;
      margin-left: -2px;
    }
    .instructions {
      font-weight: bold;
      font-size: 0.95rem;
      color: #4b5563;
      background: #f3f4f6;
      border-radius: 8px;
      padding: 1rem;
      border-left: 4px solid #10b981;
    }
    @media (max-width: 480px) {
      .container {
        padding: 2rem 1.5rem;
      }
      h1 {
        font-size: 1.5rem;
      }
      .success-icon {
        width: 60px;
        height: 60px;
      }
      .checkmark {
        width: 30px;
        height: 15px;
        margin-top: -3px;
        margin-left: -1px;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <div class="success-icon">
    <div class="checkmark"></div>
  </div>
  <h1>Authentication Successful!</h1>
  <p>The agent "{{agentName}}" is now authenticated.</p>
  <p class="instructions">You can safely close this browser tab now.</p>
</div>
</body>
</html>
